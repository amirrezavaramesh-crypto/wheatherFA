<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>نقشه زنده آب‌وهوای جهان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<link href="https://cdn.maptiler.com/maptiler-sdk-js/v3.0.0/maptiler-sdk.css" rel="stylesheet">
<script src="https://cdn.maptiler.com/maptiler-sdk-js/v3.0.0/maptiler-sdk.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#06101a;color:#eaf6fb;font-family:'Vazirmatn','Vazir',Tahoma,Arial,sans-serif;font-weight:400;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.maplibregl-map,.maplibregl-ctrl,input,button{font-family:inherit}
#map{position:absolute;inset:0}
.glass{background:rgba(8,20,32,.82);border:1px solid rgba(120,200,255,.18);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:14px;box-shadow:0 6px 30px rgba(0,0,0,.35)}
.ui{position:absolute;z-index:10}

/* top */
#top{top:14px;right:14px;left:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;pointer-events:none;flex-wrap:wrap}
#top>*{pointer-events:auto}
.brand{padding:10px 16px;font-weight:700;font-size:16px;letter-spacing:-.2px;display:flex;align-items:center;gap:9px}
.dot{width:8px;height:8px;border-radius:50%;background:#3dffa8;box-shadow:0 0 10px #3dffa8;animation:p 1.6s infinite}
@keyframes p{50%{opacity:.35}}
.tabs{display:flex;padding:5px;gap:4px}
.tab{border:0;background:transparent;color:#9fc0cf;padding:9px 16px;border-radius:10px;cursor:pointer;font:inherit;font-size:14px;font-weight:500}
.tab:hover{color:#fff}
.tab.on{background:#2f8cff;color:#fff}
.search{display:flex;padding:5px;gap:4px;min-width:230px}
.search input{flex:1;background:rgba(0,0,0,.25);border:1px solid rgba(120,200,255,.15);border-radius:10px;color:#fff;padding:0 12px;height:36px;font:inherit;font-size:12px;outline:none;min-width:0}
.search input:focus{border-color:#2f8cff}
.search button{border:0;background:#2f8cff;color:#fff;border-radius:10px;padding:0 12px;cursor:pointer;font:inherit;font-size:12px}

/* readout */
#readout{top:76px;left:14px;padding:12px 16px;min-width:180px;direction:ltr;text-align:left}
#readout small{display:block;color:#7fa3b3;font-size:10px;margin-bottom:4px;direction:rtl;text-align:right}
#readout b{font-size:22px;font-weight:700}

/* cities */
#cities{top:76px;right:14px;padding:10px;width:150px;display:flex;flex-direction:column;gap:4px;max-height:calc(100% - 300px);overflow-y:auto;scrollbar-width:thin}
#cities button{border:0;background:rgba(255,255,255,.04);color:#cfe6f0;padding:7px 10px;border-radius:8px;cursor:pointer;font:inherit;font-size:13px;text-align:right}
#cities button:hover{background:rgba(47,140,255,.3)}

/* bottom */
#bottom{left:14px;right:14px;bottom:26px;padding:12px 16px;display:flex;flex-direction:column;gap:9px}
.ctl{display:flex;align-items:center;gap:12px;direction:ltr}
#play{width:38px;height:38px;border-radius:50%;border:0;background:#2f8cff;color:#fff;font-size:15px;cursor:pointer;flex:none}
#slider{flex:1;accent-color:#2f8cff}
#now{border:1px solid rgba(120,200,255,.25);background:transparent;color:#cfe6f0;border-radius:9px;padding:7px 12px;cursor:pointer;font:inherit;font-size:12px;flex:none}
#timeText{font-size:13px;font-weight:500;color:#bfe0ee;text-align:center}
.legend{display:flex;align-items:center;gap:10px;font-size:12px;color:#8db0c0}
#bar{flex:1;height:8px;border-radius:5px}

/* city markers */
.cm{display:flex;flex-direction:column;align-items:center;pointer-events:none;transform:translateY(-4px)}
.cm span{background:rgba(6,16,26,.82);border:1px solid rgba(120,200,255,.25);color:#fff;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:500;white-space:nowrap;text-shadow:none}
.cm i{font-style:normal;color:#7fd8ff;font-size:12px;font-weight:500;direction:ltr;display:block;text-align:center}
.cm:before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 6px #000;margin-bottom:3px}

/* loading / error */
#loading{position:fixed;inset:0;z-index:100;background:#06101a;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;font-size:13px;color:#8db0c0;transition:.5s}
#loading.hide{opacity:0;pointer-events:none}
.ring{width:48px;height:48px;border-radius:50%;border:2px solid rgba(120,200,255,.15);border-top-color:#2f8cff;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
#err{top:130px;left:50%;transform:translateX(-50%);padding:12px 18px;font-size:12px;max-width:90%;display:none;border-color:#ff6b6b;color:#ffd0d0;z-index:50}
.maplibregl-ctrl-bottom-right,.maplibregl-ctrl-bottom-left{bottom:90px!important}

.cm{pointer-events:auto;cursor:pointer}
#live{top:150px;left:14px;width:350px;max-height:calc(100% - 350px);overflow-y:auto;padding:14px;font-size:12px;scrollbar-width:thin}
.lhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.lhead b{font-size:15px}
#liveRefresh{border:0;background:rgba(47,140,255,.25);color:#fff;border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:15px}
#verdict{padding:9px 11px;border-radius:10px;background:rgba(47,140,255,.14);border:1px solid rgba(47,140,255,.35);margin-bottom:10px;line-height:1.7}
#verdict.rain{background:rgba(61,255,168,.12);border-color:rgba(61,255,168,.4)}
#srcTable{width:100%;border-collapse:collapse}
#srcTable th{color:#7fa3b3;font-weight:400;font-size:10px;text-align:right;padding:4px 3px}
#srcTable td{padding:7px 3px;border-top:1px solid rgba(255,255,255,.06);font-size:11.5px}
#srcTable td.n{white-space:nowrap}
.num{direction:ltr;display:inline-block}
td.wet .num{color:#5fd0ff;font-weight:700}
td.na{color:#667f8b}
#liveNote{margin-top:9px;color:#6f8d98;font-size:10.5px;line-height:1.8}
#liveUpdated{margin-top:6px;color:#8db0c0;font-size:11px}
#liveBtn{display:none;bottom:190px;right:10px;padding:9px 14px;color:#fff;border:1px solid rgba(120,200,255,.3);font:inherit;font-size:12px;cursor:pointer}
@media(max-width:850px){
  #live{display:none;top:auto;left:8px;right:8px;width:auto;bottom:240px;max-height:42vh}
  #live.open{display:block}
  #liveBtn{display:block}
  #cities{display:none}
  #readout{top:auto;bottom:190px;left:10px;min-width:150px;padding:8px 12px}
  #top{right:8px;left:8px;top:8px}
  .tab{padding:8px 11px;font-size:12px}
  .search{min-width:100%}
  #bottom{left:8px;right:8px;bottom:18px}
}
</style>
</head>
<body>

<div id="loading"><div class="ring"></div><div id="loadText">در حال بارگذاری نقشه و داده‌های آب‌وهوا...</div></div>
<div id="map"></div>
<div id="err" class="ui glass"></div>

<div id="top" class="ui">
  <div class="brand glass"><span class="dot"></span> آب‌وهوای زنده جهان</div>
  <div class="tabs glass" id="tabs"></div>
  <div class="search glass">
    <input id="q" placeholder="جستجوی شهر (مثلاً Paris یا مشهد)">
    <button id="go">برو</button>
  </div>
</div>

<div id="readout" class="ui glass"><small id="rLabel">مکان‌نما</small><b id="rVal">--</b></div>
<div id="cities" class="ui glass"></div>

<div id="live" class="ui glass">
  <div class="lhead"><b id="liveTitle">--</b><button id="liveRefresh" title="به‌روزرسانی">⟳</button></div>
  <div id="verdict">در حال دریافت از منابع مختلف...</div>
  <table id="srcTable"><thead><tr><th>منبع</th><th>دما</th><th>بارش</th><th>باد</th><th>ساعت</th></tr></thead><tbody></tbody></table>
  <div id="liveNote">این‌ها خروجی لحظه‌ای مدل‌های هواشناسی و سرویس‌های آنلاین‌اند و رادار نیستند؛ بارش‌های کوتاه و محلی ممکن است دیده نشوند. برای هشدار رسمی به irimo.ir مراجعه کنید.</div>
  <div id="liveUpdated"></div>
</div>
<button id="liveBtn" class="ui glass" onclick="document.getElementById('live').classList.toggle('open')">منابع زنده</button>

<div id="bottom" class="ui glass">
  <div class="legend"><span id="lMin">کم</span><div id="bar"></div><span id="lMax">زیاد</span></div>
  <div class="ctl">
    <button id="play" title="پخش / توقف">▶</button>
    <input id="slider" type="range" min="0" max="1" step="1" value="0">
    <button id="now">اکنون</button>
  </div>
  <div id="timeText">--</div>
</div>

<script>
const KEY = "DYNYFEONTFJ8PJcqbNa0";           // MapTiler key
const WEATHER_URLS = [
  "https://cdn.maptiler.com/maptiler-weather/v3.1.1/maptiler-weather.umd.min.js",
  "https://cdn.maptiler.com/maptiler-weather/v3.1.0/maptiler-weather.umd.min.js",
  "https://cdn.maptiler.com/maptiler-weather/v3.0.0/maptiler-weather.umd.min.js"
];
const $ = id => document.getElementById(id);

const CITIES = [
  {n:"تهران",lng:51.39,lat:35.69,z:0},
  {n:"پردیس",lng:51.82,lat:35.74,z:7},
  {n:"بومهن",lng:51.87,lat:35.73,z:7},
  {n:"مشهد",lng:59.61,lat:36.30,z:4},
  {n:"اصفهان",lng:51.67,lat:32.65,z:4},
  {n:"دبی",lng:55.27,lat:25.20,z:0},
  {n:"استانبول",lng:28.98,lat:41.01,z:0},
  {n:"مسکو",lng:37.62,lat:55.76,z:0},
  {n:"لندن",lng:-0.13,lat:51.51,z:0},
  {n:"پاریس",lng:2.35,lat:48.86,z:3},
  {n:"قاهره",lng:31.24,lat:30.04,z:0},
  {n:"دهلی‌نو",lng:77.21,lat:28.61,z:0},
  {n:"پکن",lng:116.41,lat:39.90,z:0},
  {n:"توکیو",lng:139.69,lat:35.69,z:0},
  {n:"سیدنی",lng:151.21,lat:-33.87,z:0},
  {n:"نیویورک",lng:-74.01,lat:40.71,z:0},
  {n:"لس‌آنجلس",lng:-118.24,lat:34.05,z:0},
  {n:"سائوپائولو",lng:-46.63,lat:-23.55,z:0},
  {n:"ژوهانسبورگ",lng:28.05,lat:-26.20,z:0}
];

const LAYERS = {
  precip:{label:"بارش", unit:"mm/h",
    make:()=>new maptilerweather.PrecipitationLayer({opacity:.9}),
    fmt:v=>v.value.toFixed(1)+" mm/h",
    grad:"linear-gradient(90deg,#9ad7ff,#2f8cff,#2fd16b,#f6e03a,#ff8a2f,#ff3b3b,#c13bff)", lo:"بدون بارش", hi:"شدید (۵۰ mm/h)"},
  wind:{label:"باد",
    make:()=>new maptilerweather.WindLayer({opacity:.9}),
    fmt:v=>v.speedKilometersPerHour.toFixed(0)+" km/h "+(v.compassDirection||""),
    grad:"linear-gradient(90deg,#440154,#3b528b,#21918c,#5ec962,#fde725)", lo:"آرام", hi:"تند (۴۰ m/s)"},
  temp:{label:"دما",
    make:()=>new maptilerweather.TemperatureLayer({opacity:.8}),
    fmt:v=>v.value.toFixed(1)+" °C",
    grad:"linear-gradient(90deg,#3b4cc0,#7aa0f0,#bfe3d8,#f6f0a8,#f5a05a,#d73027,#8b0000)", lo:"سرد", hi:"گرم"},
  pressure:{label:"فشار",
    make:()=>new maptilerweather.PressureLayer({opacity:.8}),
    fmt:v=>(v.value>5000?v.value/100:v.value).toFixed(0)+" hPa",
    grad:"linear-gradient(90deg,#2c7bb6,#abd9e9,#ffffbf,#fdae61,#d7191c)", lo:"کم‌فشار", hi:"پرفشار"}
};

function showErr(msg){ const e=$("err"); e.textContent=msg; e.style.display="block"; }
function hideLoading(){ $("loading").classList.add("hide"); setTimeout(()=>$("loading").style.display="none",600); }

function loadScript(src){
  return new Promise((res,rej)=>{
    const s=document.createElement("script"); s.src=src; s.onload=res;
    s.onerror=()=>rej(new Error("failed "+src)); document.head.appendChild(s);
  });
}
async function loadWeatherLib(){
  for(const u of WEATHER_URLS){
    try{ await loadScript(u); if(window.maptilerweather) return true; }
    catch(e){ console.warn(e.message); }
  }
  return false;
}

(async function main(){
  if(!window.maptilersdk){ hideLoading(); showErr("کتابخانه MapTiler SDK بارگذاری نشد. اینترنت/VPN را بررسی کنید."); return; }
  if(!(await loadWeatherLib())){ hideLoading(); showErr("ماژول آب‌وهوای MapTiler بارگذاری نشد. در Console (F12) خطاها را ببینید."); return; }

  maptilersdk.config.apiKey = KEY;
  const style = (maptilersdk.MapStyle.BACKDROP && maptilersdk.MapStyle.BACKDROP.DARK) || maptilersdk.MapStyle.BACKDROP;

  const map = window.map = new maptilersdk.Map({
    container:"map", style,
    center:[30,28], zoom:1.9, minZoom:1.2, maxZoom:11,
    navigationControl:true, geolocateControl:false
  });

  map.on("error", e=>{
    const m = (e && e.error && (e.error.message||e.error.status)) || "";
    console.error("Map error:", e.error || e);
    if(/403|401|key/i.test(String(m))) showErr("کلید MapTiler برای این دامنه مجاز نیست (خطای 403/401). در پنل MapTiler دامنه یا localhost را به کلید اضافه کنید.");
  });

  /* ---------- state ---------- */
  let current=null, currentKey=null, playing=false, wantedTime=Date.now();
  const slider=$("slider"), playBtn=$("play");
  let pointer=null;

  /* ---------- tabs ---------- */
  const tabs=$("tabs");
  Object.entries(LAYERS).forEach(([k,L])=>{
    const b=document.createElement("button");
    b.className="tab"; b.textContent=L.label; b.dataset.k=k;
    b.onclick=()=>setLayer(k); tabs.appendChild(b);
  });

  /* ---------- city markers ---------- */
  const markers = CITIES.map(c=>{
    const el=document.createElement("div"); el.className="cm";
    el.innerHTML='<span>'+c.n+'</span><i>--</i>';
    el.onclick=ev=>{ ev.stopPropagation(); selectLocation(c); if(window.innerWidth<=850) $("live").classList.add("open"); };
    new maptilersdk.Marker({element:el,anchor:"bottom"}).setLngLat([c.lng,c.lat]).addTo(map);
    return {c,el,val:el.querySelector("i")};
  });
  function syncMarkers(){
    const z=map.getZoom();
    markers.forEach(m=>{ m.el.style.display = z>=m.c.z ? "" : "none"; });
  }
  map.on("zoom",syncMarkers); syncMarkers();
  const cityBox=$("cities");
  CITIES.forEach(c=>{
    const b=document.createElement("button"); b.textContent=c.n;
    b.onclick=()=>{ map.flyTo({center:[c.lng,c.lat],zoom:7,duration:1400}); pointer={lng:c.lng,lat:c.lat}; updatePick(); selectLocation(c); };
    cityBox.appendChild(b);
  });

  /* ---------- helpers ---------- */
  function fmtTime(d){
    return d.toLocaleString("fa-IR",{weekday:"long",month:"long",day:"numeric",hour:"2-digit",minute:"2-digit"})+" (به وقت دستگاه شما)";
  }
  function refreshTime(){
    if(!current) return;
    const d=current.getAnimationTimeDate();
    $("timeText").textContent=fmtTime(d);
  }
  /* ---------- live city values (Open-Meteo, real current data) ---------- */
  let cityLive=null;
  const LIVEFMT={
    precip:v=>v.precipitation.toFixed(1)+" mm",
    wind:v=>Math.round(v.wind_speed_10m)+" km/h",
    temp:v=>Math.round(v.temperature_2m)+"°C",
    pressure:v=>Math.round(v.surface_pressure)+" hPa"
  };
  function updateCities(){
    markers.forEach((m,i)=>{
      const v=cityLive&&cityLive[i];
      m.val.textContent = v ? LIVEFMT[currentKey](v) : "--";
    });
  }
  async function loadCityLive(){
    try{
      const url="https://api.open-meteo.com/v1/forecast?latitude="+CITIES.map(c=>c.lat).join(",")+
        "&longitude="+CITIES.map(c=>c.lng).join(",")+
        "&current=temperature_2m,precipitation,wind_speed_10m,surface_pressure&timezone=auto";
      const d=await getJSON(url);
      cityLive=(Array.isArray(d)?d:[d]).map(x=>x.current);
      updateCities();
    }catch(err){ console.error("City live error:",err.message); }
  }

  function updatePick(){
    if(!current || !pointer) return;
    const v=current.pickAt(pointer.lng,pointer.lat);
    $("rLabel").textContent=LAYERS[currentKey].label+" در نقطه انتخابی";
    $("rVal").textContent = v ? LAYERS[currentKey].fmt(v) : "--";
  }

  /* ---------- layer switching ---------- */
  function setLayer(key){
    if(current){ try{ current.animateByFactor(0); map.removeLayer(current.id); }catch(e){} }
    const layer=LAYERS[key].make();
    current=layer; currentKey=key;

    layer.on("sourceReady",()=>{
      if(layer!==current) return;
      layer._ready=true; $("err").style.display="none";
      const s=+layer.getAnimationStartDate(), e=+layer.getAnimationEndDate();
      slider.min=s; slider.max=e;
      const t=Math.min(Math.max(wantedTime,s),e);
      layer.setAnimationTime(Math.floor(t/1000));
      slider.value=t; refreshTime(); updateCities(); updatePick();
      if(playing) layer.animateByFactor(3600);
      hideLoading();
    });
    layer.on("tick",()=>{
      if(layer!==current) return;
      wantedTime=+layer.getAnimationTimeDate();
      slider.value=wantedTime; refreshTime(); updateCities(); updatePick();
    });
    layer.on("animationTimeSet",()=>{ if(layer===current){ refreshTime(); updateCities(); updatePick(); } });

    let before;
    if(map.getLayer("Water")) before="Water";
    else{
      const sym=(map.getStyle().layers||[]).find(l=>l.type==="symbol");
      before=sym?sym.id:undefined;
    }
    console.log("Adding weather layer", key, "before:", before);
    try{ map.addLayer(layer,before); }
    catch(err){ console.error("addLayer failed:", err); showErr("افزودن لایه آب‌وهوا ناموفق بود: "+err.message); }
    $("timeText").textContent="در حال دریافت داده‌های آب‌وهوا...";
    clearTimeout(window._wt);
    window._wt=setTimeout(()=>{
      if(layer===current && !layer._ready){
        showErr("داده‌های آب‌وهوا دریافت نشد. در Console (F12) پیام‌های قرمز را ببینید؛ احتمالاً فیلتر شبکه یا محدودیت دامنه کلید MapTiler است.");
      }
    },12000);

    document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.k===key));
    const L=LAYERS[key];
    $("bar").style.background=L.grad; $("lMin").textContent=L.lo; $("lMax").textContent=L.hi;
    updateCities();
  }

  /* ---------- live multi-source panel ---------- */
  async function getJSON(url,ms){
    const c=new AbortController(), t=setTimeout(()=>c.abort(),ms||10000);
    try{ const r=await fetch(url,{signal:c.signal}); if(!r.ok) throw new Error(r.status); return await r.json(); }
    finally{ clearTimeout(t); }
  }
  const tehranTime=iso=>new Date(iso).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});

  async function omModel(loc,model,withNext){
    const url="https://api.open-meteo.com/v1/forecast?latitude="+loc.lat+"&longitude="+loc.lng+
      "&current=temperature_2m,precipitation,wind_speed_10m,relative_humidity_2m&timezone=auto"+
      (model?"&models="+model:"")+(withNext?"&minutely_15=precipitation&forecast_minutely_15=4":"");
    const d=await getJSON(url), c=d.current;
    const out={temp:c.temperature_2m,precip:c.precipitation,wind:c.wind_speed_10m,time:c.time.slice(11,16)};
    if(withNext&&d.minutely_15&&d.minutely_15.precipitation){
      out.next=d.minutely_15.precipitation.reduce((a,b)=>a+(b||0),0);
    }
    return out;
  }
  async function metNo(loc){
    const d=await getJSON("https://api.met.no/weatherapi/locationforecast/2.0/compact?lat="+loc.lat.toFixed(4)+"&lon="+loc.lng.toFixed(4));
    const t=d.properties.timeseries[0], i=t.data.instant.details;
    const n=t.data.next_1_hours&&t.data.next_1_hours.details;
    return {temp:i.air_temperature,precip:n?n.precipitation_amount:null,wind:i.wind_speed*3.6,time:tehranTime(t.time)};
  }
  async function wttr(loc){
    const d=await getJSON("https://wttr.in/"+loc.lat.toFixed(3)+","+loc.lng.toFixed(3)+"?format=j1");
    const c=d.current_condition[0];
    const t=(c.localObsDateTime||"").split(" ").slice(1).join(" ")||"--";
    return {temp:+c.temp_C,precip:+c.precipMM,wind:+c.windspeedKmph,time:t};
  }
  const SOURCES=[
    {id:"om",   name:"Open-Meteo",     run:l=>omModel(l,null,true)},
    {id:"ecmwf",name:"ECMWF (اروپا)",   run:l=>omModel(l,"ecmwf_ifs025")},
    {id:"gfs",  name:"GFS (آمریکا)",    run:l=>omModel(l,"gfs_seamless")},
    {id:"icon", name:"ICON (آلمان)",    run:l=>omModel(l,"icon_seamless")},
    {id:"met",  name:"MET Norway",     run:metNo},
    {id:"wttr", name:"wttr.in",        run:wttr}
  ];
  const f1=x=>(x==null||isNaN(x))?"--":(+x).toFixed(1);
  let selected=null, results={}, liveToken=0;

  function renderLive(){
    const tb=document.querySelector("#srcTable tbody"); tb.innerHTML="";
    let ok=0, wet=0, temps=[], next=null;
    SOURCES.forEach(src=>{
      const r=results[src.id], tr=document.createElement("tr");
      if(r===undefined){ tr.innerHTML='<td class="n">'+src.name+'</td><td colspan="4" class="na">در حال دریافت...</td>'; }
      else if(r===null){ tr.innerHTML='<td class="n">'+src.name+'</td><td colspan="4" class="na">در دسترس نیست</td>'; }
      else{
        ok++; const isWet=r.precip!=null&&r.precip>=0.1;
        if(isWet) wet++;
        if(r.temp!=null) temps.push(r.temp);
        if(r.next!=null) next=r.next;
        tr.innerHTML='<td class="n">'+src.name+'</td><td><span class="num">'+f1(r.temp)+'°</span></td>'+
          '<td class="'+(isWet?"wet":"")+'"><span class="num">'+f1(r.precip)+' mm</span></td>'+
          '<td><span class="num">'+Math.round(r.wind)+' km/h</span></td><td><span class="num">'+(r.time||"--")+'</span></td>';
      }
      tb.appendChild(tr);
    });
    const v=$("verdict");
    const done=SOURCES.every(s=>results[s.id]!==undefined);
    if(!done){ v.className=""; v.textContent="در حال دریافت از منابع مختلف..."; return; }
    if(!ok){ v.className=""; v.textContent="هیچ منبعی در دسترس نبود. اینترنت/VPN را بررسی کنید."; return; }
    const avg=temps.length?(temps.reduce((a,b)=>a+b,0)/temps.length).toFixed(1):"--";
    let txt = wet===0 ? "الان در هیچ‌یک از "+ok+" منبع بارشی گزارش نشده است."
                      : wet+" از "+ok+" منبع الان بارش گزارش می‌کنند.";
    txt += " میانگین دما: "+avg+"°";
    if(next!=null) txt += " • پیش‌بینی بارش یک ساعت آینده: "+next.toFixed(1)+" mm";
    v.className = wet>0 ? "rain" : ""; v.textContent=txt;
  }

  async function selectLocation(loc){
    selected=loc; const token=++liveToken; results={};
    $("liveTitle").textContent=loc.n;
    renderLive();
    await Promise.all(SOURCES.map(async src=>{
      try{ results[src.id]=await src.run(loc); }
      catch(err){ console.warn(src.name,"failed:",err.message); results[src.id]=null; }
      if(token===liveToken) renderLive();
    }));
    if(token===liveToken) $("liveUpdated").textContent="آخرین به‌روزرسانی: "+new Date().toLocaleTimeString("en-GB")+" (ساعت دستگاه شما) • خودکار هر ۱۰ دقیقه";
  }
  function refreshLive(){ if(selected) selectLocation(selected); loadCityLive(); }
  $("liveRefresh").onclick=refreshLive;
  setInterval(refreshLive,10*60*1000);
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) refreshLive(); });

  /* ---------- controls ---------- */
  playBtn.onclick=()=>{
    if(!current) return;
    playing=!playing;
    current.animateByFactor(playing?3600:0);
    playBtn.textContent=playing?"⏸":"▶";
  };
  slider.addEventListener("input",()=>{
    if(!current) return;
    wantedTime=+slider.value;
    current.setAnimationTime(Math.floor(wantedTime/1000));
  });
  $("now").onclick=()=>{
    if(!current) return;
    wantedTime=Date.now();
    current.setAnimationTime(Math.floor(wantedTime/1000));
    slider.value=wantedTime;
  };

  map.on("mousemove",e=>{ pointer=e.lngLat; updatePick(); });
  map.on("click",e=>{ pointer=e.lngLat; updatePick();
    selectLocation({n:"نقطه انتخابی ("+e.lngLat.lat.toFixed(2)+"، "+e.lngLat.lng.toFixed(2)+")",lat:e.lngLat.lat,lng:e.lngLat.lng}); });

  /* ---------- search (MapTiler geocoding) ---------- */
  let searchMarker=null;
  async function search(){
    const q=$("q").value.trim(); if(!q) return;
    try{
      const r=await fetch("https://api.maptiler.com/geocoding/"+encodeURIComponent(q)+".json?key="+KEY+"&language=fa&limit=1");
      if(!r.ok) throw new Error(r.status);
      const d=await r.json();
      if(!d.features||!d.features.length){ alert("مکان پیدا نشد."); return; }
      const [lng,lat]=d.features[0].center;
      if(searchMarker) searchMarker.remove();
      searchMarker=new maptilersdk.Marker({color:"#2f8cff"}).setLngLat([lng,lat]).addTo(map);
      map.flyTo({center:[lng,lat],zoom:8,duration:1400});
      pointer={lng,lat}; updatePick();
    }catch(err){ console.error("Search error:",err.message); alert("جستجو در دسترس نیست."); }
  }
  $("go").onclick=search;
  $("q").addEventListener("keydown",e=>{ if(e.key==="Enter") search(); });

  /* ---------- start ---------- */
  map.on("load",()=>{
    try{ map.setPaintProperty("Water","fill-color","rgba(0,0,0,0.45)"); }catch(e){}
    hideLoading();
    setLayer("precip");
    loadCityLive();
    selectLocation(CITIES[0]);
  });
})();
</script>
</body>
</html>
